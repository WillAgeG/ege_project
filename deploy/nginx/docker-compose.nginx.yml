services:
  caddy:
    profiles:
      - disabled

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      admin:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-admin.${APP_DOMAIN}}
      NGINX_ENVSUBST_FILTER: "^(APP_DOMAIN|ADMIN_DOMAIN)$$"
    volumes:
      - ./deploy/nginx/vektor.conf:/etc/nginx/templates/default.conf.template:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
      - ${NGINX_HTPASSWD_PATH:-./deploy/nginx/.htpasswd}:/etc/nginx/auth/.htpasswd:ro
    networks:
      - edge
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  certbot:
    image: certbot/certbot:latest
    profiles:
      - certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    networks:
      - edge

volumes:
  certbot_www:
  certbot_conf:
