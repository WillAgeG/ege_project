# Тюнинг PostgreSQL 17 для VPS 2–4 ГБ ОЗУ в контуре 152-ФЗ (Selectel / Timeweb / Yandex Cloud)
listen_addresses = '*'
port = 5432
max_connections = 100

shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 4MB
maintenance_work_mem = 64MB

wal_level = replica
wal_compression = on
checkpoint_completion_target = 0.9
max_wal_size = 1GB
min_wal_size = 80MB

logging_collector = off
log_min_duration_statement = 500
log_timezone = 'UTC'
timezone = 'UTC'
lc_messages = 'C.UTF-8'
lc_monetary = 'C.UTF-8'
lc_numeric = 'C.UTF-8'
lc_time = 'C.UTF-8'
