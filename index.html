<style>
/* Брендбук в стиле hh.ru: чистый белый / чёрный OLED + фирменный синий #0070FF — строго без зелёного. */
:root {
  --bg: #000000;
  --surface: #16181d;
  --surface-2: #22252e;
  --ink: #ffffff;
  --ink-2: #d4d8e2;
  --muted: #8b909d;
  --line: #282b36;
  --line-strong: #373b49;
  --accent: #1d7bff;
  --accent-hover: #0d67e8;
  --accent-ink: #ffffff;
  --accent-soft: #102548;
  --leaf: #60a5fa;
  --leaf-soft: #12233d;
  --good: #1d7bff;
  --good-soft: #102548;
  --warn: #f59e0b;
  --warn-soft: #33240a;
  --notif: #fb923c;
  --notif-soft: #2e1909;
  --confirm: #22c55e;
  --confirm-hover: #16a34a;
  --confirm-soft: #0c2b17;
  --pro: #a78bfa;
  --pro-soft: #21153b;
  --bad: #ff4d5e;
  --bad-soft: #3a171c;
  --pill-bg: #ffffff;
  --pill-ink: #141517;
  --seg-bg: #0c0d11;
  --seg-active: #242731;
  --c-bio: #a855f7;
  --c-chem: #38bdf8;
  --c-rus: #fb923c;
  --grid: #14161c;
  --axis: #373b49;
  --glow: rgba(29, 123, 255, .14);
  --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 18px 36px -18px rgba(0, 0, 0, .85);
  --font-display: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 16px;
  --r-sm: 12px;
  --side: 256px;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface-2: #f2f3f6;
  --ink: #141517;
  --ink-2: #3d424d;
  --muted: #7c828e;
  --line: #e4e6ec;
  --line-strong: #cdd2dc;
  --accent: #0070ff;
  --accent-hover: #005ce0;
  --accent-ink: #ffffff;
  --accent-soft: #ebf3ff;
  --leaf: #0070ff;
  --leaf-soft: #ebf3ff;
  --good: #0070ff;
  --good-soft: #ebf3ff;
  --warn: #b45309;
  --warn-soft: #fef3c7;
  --notif: #f97316;
  --notif-soft: #fff3eb;
  --confirm: #16a34a;
  --confirm-hover: #15803d;
  --confirm-soft: #dcfce7;
  --pro: #7c3aed;
  --pro-soft: #f3e8ff;
  --bad: #ff2b4d;
  --bad-soft: #ffe4e8;
  --pill-bg: #141517;
  --pill-ink: #ffffff;
  --seg-bg: #ebedf2;
  --seg-active: #ffffff;
  --c-bio: #7c3aed;
  --c-chem: #0284c7;
  --c-rus: #ea580c;
  --grid: #e8eaef;
  --axis: #cdd2dc;
  --glow: rgba(0, 112, 255, .04);
  --shadow: 0 1px 2px rgba(20, 21, 23, .04), 0 10px 26px -16px rgba(20, 21, 23, .14);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #000000;
  --surface: #16181d;
  --surface-2: #22252e;
  --ink: #ffffff;
  --ink-2: #d4d8e2;
  --muted: #8b909d;
  --line: #282b36;
  --line-strong: #373b49;
  --accent: #1d7bff;
  --accent-hover: #0d67e8;
  --accent-ink: #ffffff;
  --accent-soft: #102548;
  --leaf: #60a5fa;
  --leaf-soft: #12233d;
  --good: #1d7bff;
  --good-soft: #102548;
  --warn: #f59e0b;
  --warn-soft: #33240a;
  --notif: #fb923c;
  --notif-soft: #2e1909;
  --confirm: #22c55e;
  --confirm-hover: #16a34a;
  --confirm-soft: #0c2b17;
  --pro: #a78bfa;
  --pro-soft: #21153b;
  --bad: #ff4d5e;
  --bad-soft: #3a171c;
  --pill-bg: #ffffff;
  --pill-ink: #141517;
  --seg-bg: #0c0d11;
  --seg-active: #242731;
  --c-bio: #a855f7;
  --c-chem: #38bdf8;
  --c-rus: #fb923c;
  --grid: #14161c;
  --axis: #373b49;
  --glow: rgba(29, 123, 255, .14);
  --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 18px 36px -18px rgba(0, 0, 0, .85);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; max-width: 100%; overflow-x: clip; }
body {
  background: radial-gradient(ellipse 900px 380px at 56% -60px, var(--glow), transparent 70%), var(--bg);
  background-attachment: local;
  color: var(--ink);
  font: 15px/1.55 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
:root[data-theme="light"] body { background: var(--bg); }
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 30;
  background: var(--bg);
}
a { color: var(--accent); text-underline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.mono { font-family: var(--font-mono); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.small { font-size: 13px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- каркас ---------- */
.shell { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100vh; max-width: 100%; overflow-x: clip; }
.side {
  position: sticky;
  top: 0;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  gap: 20px;
  padding-block: 24px 18px;
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: 18px;
  border-right: 1px solid var(--line);
  background: var(--surface);
  overflow-y: auto;
}
.brand { display: grid; gap: 6px; }
.brand-lockup { display: flex; align-items: center; gap: 11px; min-width: 0; }
.brand-text { display: grid; gap: 2px; min-width: 0; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 11px; flex: none;
  display: grid; place-items: center; color: #fff;
  background: linear-gradient(135deg, #1652c8 0%, #2f7cff 100%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 8px 18px -10px rgba(47, 124, 255, .55);
}
.brand-mark svg { width: 24px; height: 24px; display: block; }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 18px; line-height: 1.15; letter-spacing: -.01em; white-space: nowrap; }
.brand-sub { font-family: var(--font-mono); font-size: 11px; letter-spacing: .02em; color: var(--muted); white-space: nowrap; }
.nav { display: grid; gap: 2px; }
.nav-btn {
  display: flex; align-items: center; gap: 11px;
  width: 100%; padding: 9px 10px;
  border: 0; border-radius: var(--r-sm);
  background: transparent; color: var(--ink-2);
  text-align: left; font-weight: 500;
  transition: background-color .12s ease, color .12s ease;
}
.nav-btn svg { width: 19px; height: 19px; flex: none; }
.nav-btn:hover { background: var(--surface-2); color: var(--ink); }
.nav-btn[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.side-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; padding-left: 10px; }
.subj-list { display: grid; gap: 2px; }
.subj-btn {
  display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: center; gap: 10px;
  width: 100%; padding: 8px 10px; border: 0; border-radius: var(--r-sm);
  background: transparent; color: var(--ink-2); text-align: left;
}
.subj-btn:hover:not(:disabled) { background: var(--surface-2); color: var(--ink); }
.subj-btn:disabled { cursor: default; opacity: .72; }
.subj-btn[aria-current="page"] { color: var(--ink); font-weight: 600; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.side-foot { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); display: grid; gap: 10px; }
.me { display: flex; align-items: center; gap: 10px; min-width: 0; }
.me img, .avatar { width: 34px; height: 34px; border-radius: 50%; flex: none; object-fit: cover; }
.avatar {
  display: grid; place-items: center; font-weight: 700; font-size: 13.5px; color: #fff;
  background: linear-gradient(135deg, #1d5bd6, #3b82f6); box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
}
.avatar.lg { width: 42px; height: 42px; font-size: 16px; }
.me-name { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-user { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; }
.side-tools { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
.theme-pill, .side-logout {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; min-height: 32px;
  border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2); color: var(--ink-2);
  font-size: 12.5px; font-weight: 500; transition: border-color .12s ease, color .12s ease, background-color .12s ease;
}
.theme-pill:hover, .side-logout:hover { border-color: var(--accent); color: var(--ink); }
.side-logout.danger:hover { border-color: var(--bad); color: var(--bad); background: var(--bad-soft); }
.theme-pill svg, .side-logout svg { width: 15px; height: 15px; flex: none; }

.sync { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-2); }
.sync[hidden] { display: none; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.sync[data-s="ok"] i { background: var(--good); }
.sync[data-s="saving"] i { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
.sync[data-s="local"] i, .sync[data-s="stale"] i { background: var(--warn); }
.sync[data-s="error"] i, .sync[data-s="readonly"] i { background: var(--bad); }
@keyframes pulse { 50% { opacity: .35; } }

.topbar, .tabbar { display: none; }
.main {
  min-width: 0;
  padding-block: 30px 72px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.page { width: 100%; max-width: 1060px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; min-width: 0; }

@media (max-width: 899px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    padding-block: 10px;
    padding-left: max(14px, env(safe-area-inset-left, 0px));
    padding-right: max(14px, env(safe-area-inset-right, 0px));
    background: color-mix(in srgb, var(--surface) 90%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .topbar .brand-lockup { min-width: 0; flex: 1 1 auto; }
  .topbar .brand-text { min-width: 0; }
  .topbar-actions { display: flex; align-items: center; gap: 6px; flex: none; }
  .topbar .brand-mark { width: 32px; height: 32px; border-radius: 9px; flex: none; }
  .topbar .brand-mark svg { width: 20px; height: 20px; }
  .topbar .brand-name { font-size: 15.5px; }
  .topbar .sync { max-width: 170px; }
  .topbar .sync span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
}
@media (max-width: 430px) {
  .topbar { padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); gap: 6px; }
  .topbar .brand-lockup { gap: 7px; }
  .topbar .brand-mark { width: 30px; height: 30px; }
  .topbar .brand-name { font-size: 13.5px; }
  .topbar-actions { gap: 4px; }
  .topbar-actions .icon-btn { width: 34px; height: 34px; }
  .topbar-actions .icon-btn svg { width: 17px; height: 17px; }
}
@media (max-width: 899px) {
  .tabbar {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    padding-top: 6px;
    padding-bottom: max(6px, env(safe-area-inset-bottom, 0px));
    padding-left: max(4px, env(safe-area-inset-left, 0px));
    padding-right: max(4px, env(safe-area-inset-right, 0px));
    background: color-mix(in srgb, var(--surface) 95%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--line);
  }
  .tab-btn {
    position: relative; display: grid; justify-items: center; gap: 3px; padding: 5px 2px; min-height: 46px;
    border: 0; background: transparent; color: var(--muted); font-size: 11px; font-weight: 500;
    border-radius: var(--r-sm); min-width: 0; touch-action: manipulation;
  }
  .tab-btn svg { width: 22px; height: 22px; }
  .tab-btn span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab-btn[aria-current="page"] { color: var(--ink); font-weight: 600; background: transparent; }
  .tab-badge {
    position: absolute; top: 2px; right: calc(50% - 19px);
    min-width: 17px; height: 17px; padding: 0 5px; border-radius: 999px;
    background: var(--notif); color: #fff; font-size: 10px; font-weight: 700;
    display: grid; place-items: center; line-height: 1;
  }
  .main { padding-block: 16px calc(92px + env(safe-area-inset-bottom, 0px)); }
  .page { gap: 16px; }
  .input, .select, .textarea, .answer-input, .essay-area { font-size: 16px; }
}
.icon-btn {
  display: inline-grid; place-items: center; width: 38px; height: 38px;
  border: 1px solid var(--line); border-radius: 50%; background: var(--surface); color: var(--ink-2);
  transition: border-color .12s ease, color .12s ease, background-color .12s ease; touch-action: manipulation;
}
.icon-btn.sm { width: 32px; height: 32px; }
.icon-btn.sm svg { width: 16px; height: 16px; }
.icon-btn:hover, .icon-btn[aria-current="page"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.icon-btn[hidden] { display: none; }
.icon-btn svg { width: 19px; height: 19px; }

/* ---------- типографика страниц ---------- */
.eyebrow { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(24px, 3.4vw, 32px); line-height: 1.15; letter-spacing: -.022em; }
.h2 { font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 1.25; letter-spacing: -.015em; }
.h3 { font-size: 16px; font-weight: 600; line-height: 1.35; }
.lead { color: var(--ink-2); max-width: 62ch; }
.head { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; min-width: 0; }
.head-row { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; }
.section { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; min-width: 0; }
.section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 14px; }

/* ---------- поверхности ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; box-shadow: 0 1px 2px rgba(0, 0, 0, .06); }
.card.pad-lg { padding: 22px; }
.well { background: var(--surface-2); border-radius: var(--r-sm); padding: 12px 14px; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 14px; }
.search-wrap { position: relative; flex: 1 1 240px; min-width: 0; }
.search-wrap .input { padding-right: 36px; }
.search-clear {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  width: 28px; height: 28px; display: grid; place-items: center;
  border: 0; border-radius: 50%; background: transparent; color: var(--muted);
}
.search-clear:hover { background: var(--surface-2); color: var(--ink); }
.search-clear svg { width: 15px; height: 15px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.grid-hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 760px) {
  .grid-2, .grid-3, .grid-hero { grid-template-columns: minmax(0, 1fr); }
}
.stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.between { justify-content: space-between; }

/* ---------- кнопки, чипы ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 42px; padding: 8px 16px;
  border: 1px solid transparent; border-radius: var(--r-sm);
  background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 14.5px;
  text-decoration: none; white-space: nowrap;
  transition: transform .2s cubic-bezier(.22, 1, .36, 1), background-color .36s cubic-bezier(.22, 1, .36, 1), border-color .3s ease, color .22s ease, box-shadow .3s ease;
}
.btn:hover { transform: translateY(-2px); background: var(--accent-hover); box-shadow: 0 8px 20px -8px color-mix(in srgb, var(--accent) 55%, transparent); }
.btn:active { transform: translateY(0) scale(.98); box-shadow: none; }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-strong); }
.btn.ghost:hover { background: var(--surface-2); border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 18px -12px rgba(20, 21, 23, .22); }
.btn.soft { background: var(--accent-soft); color: var(--leaf); border-color: color-mix(in srgb, var(--accent) 18%, transparent); }
.btn.soft:hover {
  background: color-mix(in srgb, var(--accent) 17%, var(--surface));
  color: var(--accent);
  border-color: color-mix(in srgb, var(--accent) 44%, transparent);
  transform: translateY(-2px);
  box-shadow: 0 8px 18px -10px color-mix(in srgb, var(--accent) 42%, transparent);
}
.btn.is-confirmed,
.motion-bid-btn.is-confirmed {
  background: var(--confirm);
  border-color: var(--confirm);
  color: #ffffff;
  box-shadow: 0 10px 24px -10px color-mix(in srgb, var(--confirm) 65%, transparent);
  animation: confirmPop .44s cubic-bezier(.22, 1, .36, 1) both;
}
.btn.is-confirmed:hover,
.motion-bid-btn.is-confirmed:hover {
  background: var(--confirm-hover);
  border-color: var(--confirm-hover);
  transform: translateY(-2px);
  box-shadow: 0 14px 28px -10px color-mix(in srgb, var(--confirm) 72%, transparent);
}
@keyframes confirmPop {
  0% { transform: scale(.96); }
  45% { transform: scale(1.025); }
  100% { transform: scale(1); }
}
.btn.danger { background: var(--bad); color: #fff; }
.btn.danger:hover { background: var(--bad); transform: translateY(-2px); box-shadow: 0 8px 18px -10px rgba(255, 43, 77, .48); }
.btn.white { background: #ffffff; color: #0070ff; border-color: #ffffff; }
.btn.white:hover { background: #f2f6ff; transform: translateY(-2px); box-shadow: 0 8px 20px -8px rgba(0, 0, 0, .28); }
.btn.blue-ghost { background: rgba(255, 255, 255, .16); color: #ffffff; border-color: rgba(255, 255, 255, .36); }
.btn.blue-ghost:hover { background: rgba(255, 255, 255, .26); transform: translateY(-2px); box-shadow: 0 8px 18px -10px rgba(0, 0, 0, .22); }
.btn.sm { min-height: 32px; padding: 5px 12px; font-size: 13.5px; }
.btn svg { width: 17px; height: 17px; }
.link-btn { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; font-size: 14px; }
.link-btn:hover { text-decoration: underline; text-underline-offset: 3px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px;
  border-radius: 999px; font-size: 12.5px; font-weight: 500; white-space: nowrap;
  background: var(--surface-2); color: var(--ink-2);
}
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.confirm { background: var(--confirm-soft); color: var(--confirm); }
.chip.pro { background: var(--pro-soft); color: var(--pro); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.notif { background: var(--notif-soft); color: var(--notif); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.chip.leaf { background: var(--leaf-soft); color: var(--leaf); }
.chip svg { width: 13px; height: 13px; }
.notif-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--notif); flex: none; }

/* ---------- метры ---------- */
.meter { height: 8px; border-radius: 999px; background: var(--leaf-soft); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--leaf)); min-width: 0; transition: width .4s ease; }
.meter.accent { background: var(--accent-soft); }
.meter.accent > i { background: var(--accent); }
.meter.thin { height: 6px; }

/* ---------- плитки показателей ---------- */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.tile-label { font-size: 13px; color: var(--ink-2); }
.tile-value { font-size: 26px; font-weight: 600; line-height: 1.15; letter-spacing: -.01em; }
.tile-note { font-size: 12.5px; color: var(--muted); }

/* ---------- главный отсчёт ---------- */
.hero {
  position: relative; overflow: hidden;
  background:
    radial-gradient(circle at 92% 14%, var(--glow), transparent 54%),
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 22px 22px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 22px 22px,
    var(--surface);
  border: 1px solid var(--line); border-radius: var(--r); padding: 22px;
  display: grid; gap: 14px; align-content: space-between; min-width: 0;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .06);
}
.hero-figure { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; }
.hero-num { font-size: clamp(52px, 8vw, 72px); font-weight: 700; line-height: .95; letter-spacing: -.03em; color: var(--accent); }
.hero-unit { font-size: 20px; font-weight: 600; }
.hero-text { color: var(--ink-2); max-width: 46ch; }

/* ---------- карточки тем ---------- */
.slides { display: grid; gap: 10px; }
.slide {
  display: grid; grid-template-columns: 66px minmax(0, 1fr);
  width: 100%; padding: 0; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm);
  overflow: hidden; transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease;
}
.slide:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: var(--shadow); }
.slide-label {
  display: grid; place-items: center; align-content: center; gap: 2px;
  border-right: 1px solid var(--line);
  background: repeating-linear-gradient(135deg, var(--surface-2) 0 2px, transparent 2px 6px), var(--surface);
  font-family: var(--font-mono); font-weight: 500; font-size: 15px; color: var(--ink);
}
.slide-label small { font-size: 10px; color: var(--muted); letter-spacing: .06em; }
.slide-body { display: grid; gap: 8px; padding: 12px 14px; min-width: 0; }
.slide-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.slide-title { font-weight: 600; line-height: 1.35; }
.slide-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 12.5px; color: var(--muted); }
.qdots { display: flex; flex-wrap: wrap; gap: 4px; }
.qdot { width: 9px; height: 9px; border-radius: 2px; background: var(--surface-2); border: 1px solid var(--line-strong); }
.qdot[data-s="2"] { background: var(--good); border-color: var(--good); }
.qdot[data-s="1"] { background: var(--warn); border-color: var(--warn); }
.qdot[data-s="0"] { background: var(--bad); border-color: var(--bad); }
.qdot.big { width: 14px; height: 14px; border-radius: 3px; }

.section-block { display: grid; gap: 10px; }
.section-title { display: flex; align-items: baseline; gap: 10px; }
.section-num { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }

/* ---------- теория ---------- */
.theory { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.theory li { position: relative; padding-left: 18px; color: var(--ink-2); max-width: 72ch; }
.theory li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 6px; height: 6px; border-radius: 50%; background: var(--leaf); }
.theory b { color: var(--ink); font-weight: 600; }
.theory li.th-h { padding-left: 0; margin-top: 10px; color: var(--ink); font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.theory li.th-h:first-child { margin-top: 0; }
.theory li.th-h::before { display: none; }
.passage p + p, .essay-sample p + p { margin-top: 8px; }
.legend-r.long { display: grid; gap: 6px; }
.vgrid { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 6px; }
.vcell { display: grid; place-items: center; height: 34px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--muted); font-family: var(--font-mono); font-size: 13px; }
.vcell[data-s="ok"] { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.vcell[data-s="part"] { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.vcell[data-s="bad"] { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.essay-area { min-height: 360px; font-size: 15.5px; line-height: 1.65; }
.essay-sample { max-width: 76ch; color: var(--ink); line-height: 1.65; }
.checklist { display: grid; gap: 10px; }
.checklist label { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; color: var(--ink-2); }
.checklist .check { flex: none; margin-top: 1px; }
.plan-list { display: grid; gap: 8px; margin: 0; padding-left: 22px; color: var(--ink-2); max-width: 72ch; }
.plan-list b { color: var(--ink); font-weight: 600; }
@media (max-width: 640px) { .vgrid { grid-template-columns: repeat(7, minmax(0, 1fr)); } }

/* ---------- тест ---------- */
.quiz-top { display: grid; gap: 10px; }
.quiz-strip { display: flex; gap: 3px; align-items: center; }
.quiz-seg { flex: 1; height: 5px; border-radius: 999px; background: var(--line); transition: background-color .15s ease, transform .15s ease; }
.quiz-seg.cur { background: var(--accent); transform: scaleY(1.35); }
.quiz-seg.done { background: var(--accent-soft); border: 1px solid var(--accent); height: 6px; }
.quiz-seg.ok { background: var(--good); }
.quiz-seg.part { background: var(--warn); }
.quiz-seg.bad { background: var(--bad); }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; display: grid; gap: 18px; box-shadow: var(--shadow); }
.qtext { font-size: 18px; font-weight: 500; line-height: 1.45; max-width: 68ch; white-space: pre-line; }
.passage { display: grid; gap: 6px; padding: 14px 16px; border-radius: var(--r-sm); background: var(--surface-2); max-width: 76ch; }
.passage p { font-size: 15.5px; line-height: 1.7; color: var(--ink); }
.qfig { max-width: 460px; color: var(--ink-2); }
.qfig svg { display: block; width: 100%; height: auto; }
.qtbl-wrap { overflow-x: auto; max-width: 76ch; }
.qtbl { border-collapse: collapse; font-size: 14.5px; width: 100%; }
.qtbl th, .qtbl td { border: 1px solid var(--line-strong); padding: 7px 10px; text-align: left; vertical-align: top; }
.qtbl th { background: var(--surface-2); font-weight: 600; color: var(--ink); }
.qtbl td { color: var(--ink-2); }
.opts { display: grid; gap: 8px; }
.opt {
  display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; gap: 12px;
  width: 100%; padding: 11px 14px; text-align: left;
  border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--surface);
  transition: border-color .12s ease, background-color .12s ease;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt-key {
  display: grid; place-items: center; width: 28px; height: 28px; border-radius: 7px;
  font-family: var(--font-mono); font-size: 13px; background: var(--surface-2); color: var(--ink-2);
}
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt[aria-pressed="true"] .opt-key { background: var(--accent); color: var(--accent-ink); }
.opt.ok { border-color: var(--good); background: var(--good-soft); }
.opt.ok .opt-key { background: var(--good); color: #fff; }
.opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.opt.bad .opt-key { background: var(--bad); color: #fff; }
.opt.miss { border-color: var(--good); border-style: dashed; }
.opt-mark { font-size: 12.5px; font-weight: 600; }
.legend-r { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 10px 12px; border-radius: var(--r-sm); background: var(--surface-2); font-size: 14px; }
.legend-r b { font-family: var(--font-mono); font-weight: 500; color: var(--accent); margin-right: 4px; }
.mrows { display: grid; gap: 8px; }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); }
.mrow.ok { border-color: var(--good); background: var(--good-soft); }
.mrow.bad { border-color: var(--bad); background: var(--bad-soft); }
.mrow-fix { grid-column: 1 / -1; font-size: 13px; color: var(--ink-2); }
.seg { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
.seg button {
  min-width: 34px; height: 32px; padding: 0 8px; border-radius: 7px;
  border: 1px solid var(--line-strong); background: var(--surface);
  font-family: var(--font-mono); font-size: 13px;
}
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.seg button:disabled { cursor: default; }
@media (max-width: 560px) { .mrow { grid-template-columns: minmax(0, 1fr); } .seg { justify-content: flex-start; } }
.order-pool { display: grid; gap: 8px; }
.ord {
  display: grid; grid-template-columns: 28px minmax(0, 1fr); align-items: center; gap: 12px;
  width: 100%; padding: 10px 14px; text-align: left;
  border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--surface);
}
.ord .opt-key { width: 28px; height: 28px; }
.ord[data-n] .opt-key { background: var(--accent); color: var(--accent-ink); }
.ord.ok { border-color: var(--good); background: var(--good-soft); }
.ord.bad { border-color: var(--bad); background: var(--bad-soft); }
.answer-input {
  width: 100%; max-width: 420px; padding: 12px 14px; font-size: 17px;
  border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--surface);
}
.answer-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.feedback { display: grid; gap: 10px; padding: 14px 16px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface-2); }
.feedback[data-r="2"] { background: var(--good-soft); border-color: transparent; }
.feedback[data-r="1"] { background: var(--warn-soft); border-color: transparent; }
.feedback[data-r="0"] { background: var(--bad-soft); border-color: transparent; }
.fb-title { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.feedback[data-r="2"] .fb-title { color: var(--good); }
.feedback[data-r="1"] .fb-title { color: var(--warn); }
.feedback[data-r="0"] .fb-title { color: var(--bad); }
.fb-title svg { width: 18px; height: 18px; }
.ai-box { display: grid; gap: 8px; padding: 12px 14px; border-radius: var(--r-sm); background: var(--surface); border: 1px solid var(--line); }
.ai-text { color: var(--ink); }
.ai-text p + p, .ai-text ul, .ai-text ol { margin-top: 8px; }
.ai-text ul, .ai-text ol { padding-left: 20px; margin-bottom: 0; }
.qfoot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.kbd { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }
@media (max-width: 560px) { .kbd { display: none; } .qcard { padding: 16px; } .qtext { font-size: 16.5px; } }

/* ---------- итог теста ---------- */
.result-num { font-size: 56px; font-weight: 700; line-height: 1; letter-spacing: -.03em; }
.review-list { display: grid; gap: 8px; }
.review-item { display: grid; gap: 4px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }

/* ---------- план ---------- */
.phase { display: grid; gap: 8px; }
.phase-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.todo {
  display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 12px;
  padding: 13px 14px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface);
}
.todo.key { border-color: var(--leaf); }
.todo.done { background: var(--surface-2); }
.todo.done .todo-title { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-strong); }
.todo.done .todo-note { opacity: .82; }
.check {
  appearance: none; -webkit-appearance: none; margin: 1px 0 0;
  width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--line-strong); background: var(--surface);
  display: grid; place-items: center; cursor: pointer;
}
.check:checked { background: var(--good); border-color: var(--good); }
.check:checked::after { content: ""; width: 10px; height: 6px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: translateY(-1px) rotate(-45deg); }
.todo-main { display: grid; gap: 5px; min-width: 0; }
.todo-top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
.todo-title { font-weight: 600; line-height: 1.4; }
.todo-note { font-size: 13.5px; color: var(--ink-2); max-width: 78ch; }
.todo-result {
  display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; width: fit-content; max-width: 100%;
  padding: 5px 10px; border-radius: var(--r-sm); background: var(--accent-soft);
  color: var(--ink); font-size: 13px; border: 1px solid var(--line);
}
.todo-result svg { width: 15px; height: 15px; color: var(--good); flex-shrink: 0; }
.todo-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; margin-top: 2px; font-size: 13px; }

/* ---------- формы ---------- */
.form { display: grid; gap: 12px; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.field { display: grid; gap: 5px; min-width: 0; }
.field label, .field .label { font-size: 13px; font-weight: 500; color: var(--ink-2); }
.input, .select, .textarea {
  width: 100%; min-width: 0; padding: 9px 12px; min-height: 40px;
  border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--surface);
  transition: border-color .12s ease, box-shadow .12s ease;
}
.textarea { min-height: 80px; resize: vertical; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.hint { font-size: 12.5px; color: var(--muted); }
.label { font-size: 13px; font-weight: 500; color: var(--ink-2); }
.switch { display: flex; flex-wrap: wrap; gap: 6px; }
.switch button {
  display: inline-flex; align-items: center; gap: 7px;
  min-height: 34px; padding: 5px 14px; border-radius: 999px;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2); font-weight: 500; font-size: 14px;
  transition: border-color .12s ease, background-color .12s ease, color .12s ease;
}
.switch button:hover:not(:disabled):not([aria-pressed="true"]) { border-color: var(--accent); color: var(--accent); }
.switch button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.switch button svg { width: 15px; height: 15px; flex: none; }
.switch button:disabled { cursor: default; opacity: .6; }
.qlegend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); }
.qlegend span { display: inline-flex; align-items: center; gap: 6px; }
.notice { display: grid; gap: 6px; padding: 14px 16px; border-radius: var(--r-sm); background: var(--warn-soft); color: var(--ink); }
.notice.info { background: var(--accent-soft); }
.notice b { font-weight: 600; }

/* ---------- списки записей ---------- */
.entries { display: grid; }
.entry { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.entry:last-child { border-bottom: 0; }
.entry-date { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); min-width: 52px; }
.entry-main { min-width: 0; display: grid; gap: 2px; }
.entry-title { font-weight: 500; }
.entry-sub { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.x-btn { border: 0; background: none; color: var(--muted); padding: 6px; border-radius: 6px; }
.x-btn:hover { background: var(--bad-soft); color: var(--bad); }
.x-btn svg { width: 16px; height: 16px; }
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12.5px; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 9px 10px 9px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }

/* ---------- графики ---------- */
.chart { position: relative; width: 100%; min-height: 40px; }
.chart svg { display: block; overflow: visible; }
.chart text { fill: var(--muted); font-family: var(--font-body); font-size: 11.5px; }
.chart .lbl { fill: var(--ink-2); font-size: 12px; font-weight: 500; }
.chart .grid-l { stroke: var(--grid); stroke-width: 1; }
.chart .axis-l { stroke: var(--axis); stroke-width: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.tip {
  position: fixed; z-index: 50; pointer-events: none;
  padding: 7px 10px; border-radius: 8px; max-width: 240px;
  background: var(--ink); color: var(--bg); font-size: 12.5px; line-height: 1.4;
  box-shadow: var(--shadow);
}

/* ---------- репетитор и справочник ---------- */
.chat { display: grid; gap: 12px; }
.bubble { max-width: min(680px, 92%); padding: 12px 15px; border-radius: 16px; line-height: 1.55; overflow-wrap: anywhere; }
.bubble.me { justify-self: end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 5px; }
.bubble.ai { justify-self: start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 5px; }
.composer { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: end; }
.suggest { display: flex; flex-wrap: wrap; gap: 8px; }
.suggest button { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-size: 13.5px; text-align: left; }
.suggest button:hover { border-color: var(--accent); color: var(--accent); }

/* ---------- показатели и справочник ---------- */
.stat-kv { display: grid; gap: 6px; padding-top: 4px; border-top: 1px solid var(--line); font-size: 13.5px; }
.stat-kv-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
details.manual-box { padding: 0; overflow: hidden; }
details.manual-box > summary {
  list-style: none; cursor: pointer; padding: 16px 18px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  font-weight: 600; touch-action: manipulation;
}
details.manual-box > summary::-webkit-details-marker { display: none; }
details.manual-box > summary::after {
  content: "+"; width: 28px; height: 28px; border-radius: 50%; flex: none;
  display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2);

/* ---------- прочее ---------- */

}

.empty { display: grid; gap: 8px; justify-items: start; padding: 18px; border: 1px dashed var(--line-strong); border-radius: var(--r); color: var(--ink-2); }

}

.step-sub { font-size: 13px; color: var(--muted); }

.facts { display: flex; flex-wrap: wrap; gap: 10px; }
.fact { display: grid; gap: 2px; padding: 10px 14px; border-radius: var(--r-sm); background: var(--surface-2); min-width: 0; flex: 1 1 160px; }

}

.bid-time-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; }
@media (max-width: 520px) { .bid-time-row { grid-template-columns: minmax(0, 1fr); } }

/* степпер цены (inDrive / единый сегмент) */
.bid-stepper {
  display: grid; grid-template-columns: 84px minmax(0, 1fr) 84px; align-items: stretch; gap: 3px;
  min-height: 46px; padding: 3px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2);
}
.bid-stepper .btn {
  min-width: 0; min-height: 38px; height: 100%; border: 0; border-radius: 9px;
  background: var(--surface); color: var(--ink); font-weight: 600; justify-content: center;
  box-shadow: 0 1px 2px rgba(20, 21, 23, .06);
}
.bid-stepper .btn:hover { background: var(--accent-soft); color: var(--accent); border-color: transparent; transform: none; box-shadow: none; }
.bid-input {
  text-align: center; font-family: var(--font-display); font-size: 19px; font-weight: 700;
  border: 0; background: transparent; padding: 4px 6px; min-height: 0; box-shadow: none;
}
.bot-preview {
  padding: 12px 14px; border-radius: var(--r-sm); background: var(--surface-2); border: 1px dashed var(--line-strong);
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; font-size: 13px; color: var(--ink-2); line-height: 1.5; min-width: 0;
}
.reqs-strip { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; min-width: 0; }
.req-item { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); min-width: 0; }

@media (max-width: 600px) {
  .land-top { padding: 8px 10px; gap: 8px; }
  .land-top .brand-sub { display: none; }
  .land-top-actions .btn { padding: 7px 10px; font-size: 13px; }
  .land-hero-ctas .btn { width: 100%; justify-content: center; }
  .chip-rail.swipe { display: flex; flex-wrap: nowrap; width: 100%; max-width: 100%; min-width: 0; overflow-x: auto; overflow-y: visible; padding: 5px 4px 8px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .chip-rail.swipe > * { flex: 0 0 auto; }
  .chip-rail.swipe::-webkit-scrollbar { display: none; }
  .day-cir { flex: 0 0 64px; }
  .hr-cir { width: 100%; min-width: 0; min-height: 44px; padding: 6px 8px; }
  .tutor-foot .btn { width: 100%; justify-content: center; }
  .input, select.input, textarea.input { font-size: 16px; }
}

/* ---------- UI в стиле референса (сегменты, поиск, карточки, фильтр-шторка, учёба) ---------- */
.hh-seg {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 4px;
  padding: 4px; border-radius: 14px; background: var(--seg-bg); border: 1px solid var(--line);
}
.hh-seg button {
  min-height: 36px; padding: 6px 12px; border: 0; border-radius: 10px;
  background: transparent; color: var(--muted); font-size: 14px; font-weight: 500;
  transition: background-color .12s ease, color .12s ease;
}
.hh-seg button[aria-pressed="true"] {
  background: var(--seg-active); color: var(--ink); font-weight: 600;
}

.hh-search-box { position: relative; min-width: 0; }
.hh-search-ico {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  color: var(--muted); pointer-events: none; display: grid; place-items: center;
}
.hh-search-ico svg { width: 18px; height: 18px; }
.hh-search-input {
  width: 100%; min-height: 46px; padding: 10px 40px 10px 42px;
  border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  color: var(--ink); font-size: 15px;
}
.hh-search-input::placeholder { color: var(--muted); }
.hh-search-input:focus { outline: none; border-color: var(--accent); }

.hh-sort-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
}
.hh-sort-btn {
  display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 4px 0;
  color: var(--leaf); font-size: 14px; font-weight: 500;
}
.hh-sort-btn svg { width: 16px; height: 16px; }

.verified-badge {
  display: inline-grid; place-items: center; width: 18px; height: 18px; flex: none;
  border-radius: 50%; background: var(--accent); color: #fff;
}
.verified-badge svg { width: 11px; height: 11px; stroke-width: 2.8; }

.fav-btn {
  width: 36px; height: 36px; border-radius: 50%; border: 0; background: transparent;
  color: var(--muted); display: grid; place-items: center; flex: none;
}
.fav-btn:hover { background: var(--surface-2); color: var(--ink); }
.fav-btn[aria-pressed="true"] { color: var(--bad); }
.fav-btn svg { width: 20px; height: 20px; }

.tutor-rate { font-size: 21px; font-weight: 700; letter-spacing: -.01em; color: var(--ink); line-height: 1.2; }
.tutor-name-line { display: flex; align-items: center; gap: 6px; font-size: 14.5px; color: var(--ink-2); flex-wrap: wrap; }
.tutor-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tutor-tag-pill {
  display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px;
  border-radius: 8px; background: var(--surface-2); color: var(--ink-2); font-size: 13px;
}
.tutor-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 2px; }
.tutor-actions.single { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 420px) { .tutor-actions { grid-template-columns: minmax(0, 1fr); } }

.hh-notice-card {
  display: grid; gap: 10px; padding: 16px 18px; border-radius: var(--r);
  background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 26%, transparent);
}
.hh-chat-list { display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.hh-chat-row {
  display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 12px;
  padding: 13px 16px; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit;
  min-width: 0;
}
.hh-chat-row:last-child { border-bottom: 0; }
.hh-chat-row:hover { background: var(--surface-2); }

.week-days-grid { display: grid; gap: 10px; }
.week-day-card {
  display: grid; gap: 10px; padding: 14px 16px; border-radius: var(--r);
  background: var(--surface); border: 1px solid var(--line);
}
.week-day-card.active-day { border-color: var(--accent); }
.week-slot-row {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px 12px; border-radius: var(--r-sm); background: var(--surface-2); min-width: 0;
}
.wa-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 36px; padding: 6px 12px; border-radius: 10px; border: 0;
  background: var(--accent-soft); color: var(--leaf); font-size: 13.5px; font-weight: 600;
  text-decoration: none; white-space: nowrap;
}
.wa-btn:hover { filter: brightness(1.12); }
.wa-btn svg { width: 16px; height: 16px; flex: none; }

.sheet-modal {
  padding: 0; overflow: hidden; display: grid; grid-template-rows: auto 1fr auto;
  max-height: min(92dvh, 780px); gap: 0;
}
.sheet-head {
  display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 8px;
  padding: 14px 16px; border-bottom: 1px solid var(--line);
}
.sheet-body { overflow-y: auto; padding: 16px; display: grid; gap: 18px; align-content: start; }
.sheet-foot { padding: 12px 16px; border-top: 1px solid var(--line); background: var(--surface); }
/* Предотвращение горизонтального переполнения на мобильных устройствах */
.shell, .main, .page, .land-sec, .card, .tutor-grid, .tutor-card, .week-days-grid, .week-day-card, .hh-chat-list, .hh-notice-card, .hh-seg, .chip-rail {
  min-width: 0;
  max-width: 100%;
}
.main { overflow-x: clip; }
@media (max-width: 759px) { .cal-days { width: 100%; max-width: 100%; min-width: 0; overflow-x: auto; } }
.hh-seg { display: flex; align-items: stretch; gap: 4px; }
.hh-seg button { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 899px) {
  .topbar, .brand-lockup, .tabbar { min-width: 0; max-width: 100%; }
  .brand-lockup { overflow: hidden; }
  .topbar-actions { flex: none; }
}
@media (max-width: 760px) {
  .tutor-grid { grid-template-columns: minmax(0, 1fr); }
  .hh-seg button { padding: 6px 8px; font-size: 13px; }
  .hh-chat-row, .week-slot-row, .tutor-head, .tutor-foot { min-width: 0; max-width: 100%; }
  .hh-chat-row > *, .week-slot-row > *, .tutor-head > *, .tutor-foot > * { min-width: 0; }
}

/* ---------- UX/UI и моушен-дизайн лендинга (строго чёрно-синяя палитра без зелёного) ---------- */
@keyframes heroRise {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes orbFloatA {
  0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
  50% { transform: translate3d(28px, -18px, 0) scale(1.08); }
}
@keyframes orbFloatB {
  0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
  50% { transform: translate3d(-24px, 22px, 0) scale(.94); }
}
@keyframes shimmerBorder {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
@keyframes btnWave {
  0% { transform: scale(.88); opacity: .75; }
  100% { transform: scale(1.16); opacity: 0; }
}
@keyframes pulseDot {
  0%, 100% { box-shadow: 0 0 0 0 rgba(96, 165, 250, .65); }
  60% { box-shadow: 0 0 0 7px rgba(96, 165, 250, 0); }
}
@keyframes marqueeLeft {
  0% { transform: translate3d(0, 0, 0); }
  100% { transform: translate3d(-50%, 0, 0); }
}
@keyframes marqueeRight {
  0% { transform: translate3d(-50%, 0, 0); }
  100% { transform: translate3d(0, 0, 0); }
}

.hero-stage-wrap {
  position: relative; overflow: hidden; border-radius: 24px; padding: 26px;
  border: 1px solid color-mix(in srgb, var(--accent) 26%, var(--line));
  background:
    radial-gradient(620px circle at var(--mx, 72%) var(--my, 28%), rgba(29, 123, 255, .17), transparent 62%),
    linear-gradient(155deg, color-mix(in srgb, var(--surface) 92%, #0e1a36) 0%, var(--surface) 60%);
  box-shadow: var(--shadow);
  min-width: 0; max-width: 100%;
}
:root[data-theme="light"] .hero-stage-wrap {
  background: #ffffff;
  border-color: var(--line);
  box-shadow: var(--shadow);
}
.hero-stage-wrap::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image: radial-gradient(rgba(120, 165, 255, .16) 1px, transparent 1px);
  background-size: 24px 24px;
  mask-image: radial-gradient(ellipse 85% 85% at 62% 35%, #000 10%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse 85% 85% at 62% 35%, #000 10%, transparent 80%);
}
:root[data-theme="light"] .hero-stage-wrap::before { opacity: .35; }
.hero-orb {
  position: absolute; border-radius: 50%; filter: blur(52px); pointer-events: none; z-index: 0;
}
:root[data-theme="light"] .hero-orb { opacity: .05; }
.hero-orb.a { width: 260px; height: 260px; top: -70px; right: -40px; background: rgba(47, 124, 255, .24); animation: orbFloatA 9s ease-in-out infinite; }
.hero-orb.b { width: 210px; height: 210px; bottom: -80px; left: 26%; background: rgba(99, 102, 241, .16); animation: orbFloatB 11s ease-in-out infinite; }
.hero-stage-wrap > .land-hero { position: relative; z-index: 1; }
.land-hero-copy > * { animation: heroRise .6s cubic-bezier(.22, 1, .36, 1) both; }
.land-hero-copy > *:nth-child(2) { animation-delay: .05s; }
.land-hero-copy > *:nth-child(3) { animation-delay: .1s; }
.land-hero-copy > *:nth-child(4) { animation-delay: .15s; }
.land-hero-copy > *:nth-child(5) { animation-delay: .2s; }

.land-h1-grad {
  background: linear-gradient(115deg, #60a5fa 0%, #1d7bff 55%, #a5b4fc 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
:root[data-theme="light"] .land-h1-grad {
  background: none; color: #0070ff;
}

.motion-stage {
  position: relative; border-radius: 20px; padding: 18px;
  border: 1.5px solid color-mix(in srgb, var(--accent) 40%, var(--line));
  background: color-mix(in srgb, var(--surface) 94%, #0f1a33);
  box-shadow: 0 22px 48px -22px rgba(26, 109, 255, .48), inset 0 1px 0 rgba(255, 255, 255, .08);
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 11px;
  min-width: 0; max-width: 100%; overflow: hidden;
  transition: transform .35s cubic-bezier(.22, 1, .36, 1), border-color .25s ease;
}
:root[data-theme="light"] .motion-stage {
  background: #ffffff;
  border: 1.5px solid var(--line);
  box-shadow: 0 14px 32px -20px rgba(20, 21, 23, .14);
}
.motion-stage:hover { transform: translateY(-2px); border-color: var(--accent); }
.motion-head-rail { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.motion-preset-rail { display: flex; align-items: center; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; min-width: 0; flex: 1; }
.motion-preset-rail::-webkit-scrollbar { display: none; }
.live-dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
  display: inline-block; flex: none; animation: pulseDot 1.8s ease-out infinite;
}

.motion-card-body {
  padding: 14px; border-radius: 16px; border: 1px solid var(--line);
  background: var(--bg); display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px;
  position: relative;
}
:root[data-theme="light"] .motion-card-body { background: #ffffff; }

.mkt-strike { text-decoration: line-through; color: var(--muted); font-size: 13px; font-weight: 500; }
.hh-price-row { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 10px; }
.hh-price-old {
  text-decoration: line-through;
  text-decoration-thickness: 1.5px;
  text-decoration-color: currentColor;
  color: var(--muted);
  font-size: 15.5px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}
.hh-price-old.lg { font-size: 18px; }
.hh-price-now {
  font-size: 22px; font-weight: 700; letter-spacing: -.02em; color: var(--ink);
  line-height: 1.15; font-variant-numeric: tabular-nums;
}
.hh-price-now.lg { font-size: 26px; }

.hh-blue-banner {
  border-radius: 20px; padding: 24px 26px;
  background: linear-gradient(135deg, #0070ff 0%, #0055d4 100%);
  color: #ffffff;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px;
  box-shadow: 0 14px 32px -18px rgba(0, 112, 255, .55);
}
.hh-blue-banner .muted, .hh-blue-banner .small { color: rgba(255, 255, 255, .86); }
.hh-blue-banner .hh-price-old { color: rgba(255, 255, 255, .72); }
.hh-blue-banner .hh-price-now { color: #ffffff; }
.below-badge {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px;
  background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 26%, transparent);
  color: var(--accent); font-size: 11.5px; font-weight: 700; white-space: nowrap;
}

/* строгая палитра тегов по брендбуку: Серый (база) + Синий hh (выгода) + Оранжевый (уведомление / ставка ниже анкеты) */
.hh-diff-strip { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.diff-tag {
  display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px;
  border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid transparent; white-space: nowrap;
}
.diff-tag.market {
  background: var(--surface-2); border-color: var(--line); color: var(--muted);
  text-decoration: line-through;
}
.diff-tag.rate {
  background: var(--surface-2); border-color: var(--line); color: var(--ink-2);
}
.diff-tag.save-hot {
  background: var(--notif-soft); border-color: color-mix(in srgb, var(--notif) 30%, transparent); color: var(--notif);
}
.diff-tag.save-cool,
.diff-tag.save-cyan {
  background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 24%, transparent); color: var(--accent);
}
.diff-tag.pro {
  background: var(--pro-soft); border-color: color-mix(in srgb, var(--pro) 34%, transparent); color: var(--pro);
}
.diff-tag.confirm {
  background: var(--confirm-soft); border-color: color-mix(in srgb, var(--confirm) 32%, transparent); color: var(--confirm);
}

/* ползунок времени 10:00–20:00: 3 варианта (чистый, с редкими рисками, полная линейка) */
.hh-time-picker {
  padding: 11px 13px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--surface); display: grid; gap: 7px;
}
.hh-time-val {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px;
  border-radius: 999px; background: var(--accent-soft); color: var(--accent);
  font-size: 12.5px; font-weight: 700; transition: background-color .2s ease, color .2s ease;
}
.hh-time-range {
  -webkit-appearance: none; appearance: none; width: 100%; height: 5px;
  border-radius: 999px; outline: none; cursor: pointer; margin: 12px 0; border: 0;
  background: linear-gradient(90deg, var(--accent) 0%, var(--accent) var(--pct, 20%), var(--line-strong) var(--pct, 20%), var(--line-strong) 100%);
}
.hh-time-range::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 10px; height: 24px; border-radius: 5px;
  background: linear-gradient(180deg, color-mix(in srgb, #fff 28%, var(--accent)) 0%, var(--accent) 52%, color-mix(in srgb, #000 14%, var(--accent)) 100%);
  border: 2px solid var(--surface);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 42%, transparent), 0 3px 10px rgba(0, 112, 255, .36);
  cursor: grab;
  transition: transform .15s ease, box-shadow .15s ease;
}
.hh-time-range.is-ruler { height: 7px; }
.hh-time-range.is-ruler::-webkit-slider-thumb {
  width: 12px; height: 26px; border-radius: 5px;
  background: linear-gradient(90deg, var(--accent) 0 4px, rgba(255,255,255,.92) 4px 5.5px, var(--accent) 5.5px 12px);
}
.hh-time-range.is-ruler::-moz-range-thumb {
  width: 12px; height: 26px; border-radius: 5px;
  background: linear-gradient(90deg, var(--accent) 0 4px, rgba(255,255,255,.92) 4px 5.5px, var(--accent) 5.5px 12px);
  border: 2px solid var(--surface);
}
.hh-time-range::-webkit-slider-thumb:hover,
.hh-time-range:focus-visible::-webkit-slider-thumb {
  transform: scaleY(1.1);
  box-shadow: 0 0 0 4px var(--accent-soft), 0 4px 12px rgba(0, 112, 255, .44);
}
.hh-time-range::-webkit-slider-thumb:active { cursor: grabbing; transform: scaleY(1.14); }
.hh-time-range::-moz-range-thumb {
  width: 10px; height: 24px; border-radius: 5px;
  background: var(--accent); border: 2px solid var(--surface);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 42%, transparent), 0 3px 10px rgba(0, 112, 255, .36);
  cursor: grab;
}
.hh-slider-ticks {
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: 0 4px; height: 8px; margin-top: -5px; margin-bottom: 1px;
}
.hh-slider-ticks i {
  display: block; width: 1.5px; height: 6px; border-radius: 2px;
  background: var(--line-strong); transition: background-color .2s ease;
}
.hh-slider-ticks.ruler i { height: 4px; width: 1px; }
.hh-slider-ticks.ruler i.major { height: 8px; width: 1.5px; background: var(--muted); }
.hh-slider-ticks i.active { background: var(--accent); }
.hh-time-ticks {
  display: flex; justify-content: space-between; font-size: 11px;
  color: var(--muted); font-family: var(--font-mono); line-height: 1;
}

/* единый сегментный степпер цены -100 ₽ / +100 ₽ без двойных рамок */
.hh-price-stepper {
  display: grid; grid-template-columns: 88px minmax(0, 1fr) 88px; gap: 3px; align-items: stretch;
  min-height: 44px; padding: 3px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2);
}
.hh-price-stepper.compact { grid-template-columns: 76px minmax(0, 1fr) 76px; min-height: 38px; }
.hh-step-btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 0; min-height: 36px; padding: 0 10px; border-radius: 9px; border: 0;
  background: var(--surface); color: var(--ink); font-size: 13.5px; font-weight: 600;
  cursor: pointer; white-space: nowrap;
  box-shadow: 0 1px 2px rgba(20, 21, 23, .06);
  transition: transform .12s ease, background-color .15s ease, color .15s ease;
}
.hh-price-stepper.compact .hh-step-btn { min-height: 30px; font-size: 13px; padding: 0 8px; }
.hh-step-btn:hover { background: var(--accent-soft); color: var(--accent); }
.hh-step-btn:active, .hh-step-btn.is-hit { transform: scale(.96); background: var(--accent); color: #fff; }
.hh-step-readout {
  display: grid; align-content: center; justify-items: center; text-align: center;
  gap: 1px; line-height: 1.15; padding: 2px 6px; min-width: 0;
}
.hh-step-readout b { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }

.motion-bid-btn {
  position: relative; overflow: visible; width: 100%; justify-content: center;
