      }
      .v-glyph { fill: url(#vektor-anim-grad); }
      @media (prefers-color-scheme: light) {
        .v-glyph { fill: #1f1a17; }
      }
      @media (prefers-reduced-motion: reduce) {
        svg:hover .v-rotor { animation: none; }
      }
    </style>
